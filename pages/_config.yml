title: Provider Limits
description: GNOME Shell extension that shows usage limits for Codex, Claude, OpenCode Go, Grok, Cursor, and Google AI (Gemini and Antigravity), with selectable Status Bar and Panel styles.
url: https://gnome-provider-limits.franciscoknebel.com
github:
  is_project_page: true
  repository_url: https://github.com/FranciscoKnebel/gnome-provider-limits
remote_theme: mmistakes/minimal-mistakes@4.28.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
exclude:
  - Gemfile
  - Gemfile.lock
  - Gemfile.bak
  - ruby_compat.rb
  - bin/
  - .ruby-version
  - README.md
atom_feed:
  hide: true
lunr:
  search_within_pages: true
