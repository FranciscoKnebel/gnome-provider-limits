name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  coverage:
    needs: check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: cobertura-coverage.xml
          format: markdown
          output: file
          badge: true

      - name: Add coverage to step summary
        if: always()
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          path: code-coverage-results.md

  gh-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: coverage
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Generate coverage badge
        run: |
          mkdir -p public
          LINE_PCT=$(awk -F'[, ]+' '/^DA:/ { total++; if ($2 > 0) covered++ } END { if (total > 0) printf "%.0f", covered/total*100 }' lcov.info)
          if   [ "$LINE_PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$LINE_PCT" -ge 80 ]; then COLOR="green"
          elif [ "$LINE_PCT" -ge 70 ]; then COLOR="yellowgreen"
          elif [ "$LINE_PCT" -ge 60 ]; then COLOR="yellow"
          else COLOR="red"
          fi
          cat > public/coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${LINE_PCT}%",
            "color": "${COLOR}"
          }
          EOF

      - name: Assemble site
        run: |
          cp -r pages/. public/
          cp README.md public/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: public
          token: ${{ secrets.GITHUB_TOKEN }}
