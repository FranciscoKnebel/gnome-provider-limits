name: Checks

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Run checks
        run: npm run check

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-soup-3.0 gettext

      - name: Run GJS tests
        run: npm run test:gjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
