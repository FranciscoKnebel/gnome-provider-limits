name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify tag version and main ancestry
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          METADATA_VERSION_NAME="$(node -p "require('./src/metadata.json')['version-name'] || ''")"

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$METADATA_VERSION_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match metadata.json version-name $METADATA_VERSION_NAME" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag $GITHUB_REF_NAME is not on origin/main" >&2
            exit 1
          fi

  check:
    needs: validate-tag
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      upload_package: true

  release:
    needs: check
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated extension package
        uses: actions/download-artifact@v8
        with:
          name: extension-package
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
